<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff">
<title>天气预报 · 城市气象服务</title>
<style>
:root{--ink:#202b36;--muted:#788593;--line:#e8edf1;--blue:#5a9fce;--pale:#f6f9fb;--green:#679e8a;--amber:#d4a15c;--anomaly:#b48b91}
*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
.page{max-width:1050px;margin:0 auto;padding:30px 28px 46px}.topline{display:flex;align-items:center;justify-content:space-between;padding-bottom:22px;border-bottom:1px solid var(--line);gap:16px}.brand{display:flex;align-items:center;gap:12px}.brandmark{width:36px;height:36px;border:1px solid #dce6ec;border-radius:11px;display:grid;place-items:center;color:#5b9bc3}.brandmark svg{width:22px;height:22px}.brandname{font-size:15px;font-weight:650;letter-spacing:.04em}.brandsub{font-size:11px;color:var(--muted);margin-top:4px;letter-spacing:.08em}.topmeta{font-size:12px;color:var(--muted);text-align:right;line-height:1.8;font-variant-numeric:tabular-nums}.clock{font-size:15px;color:#344655;font-weight:600;letter-spacing:.03em}.hero{padding:34px 0 27px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px}.eyebrow{font-size:11px;letter-spacing:.16em;color:#7f8e9b;text-transform:uppercase}.hero h1{font-size:clamp(27px,4vw,38px);font-weight:580;letter-spacing:-.04em;margin:10px 0 8px}.hero p{font-size:13px;color:var(--muted);margin:0;line-height:1.8}.update{font-size:12px;color:#7f8e9b;white-space:nowrap;padding-bottom:5px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:7px 0 13px}.sectionhead h2{font-size:14px;font-weight:650;margin:0}.sectionhead span{font-size:11px;color:#8995a0;letter-spacing:.04em}.forecast{border:1px solid var(--line);border-radius:15px;overflow:hidden}.weather-row{display:grid;grid-template-columns:minmax(100px,1.15fr) minmax(150px,1.15fr) minmax(90px,.65fr);align-items:center;gap:12px;padding:15px 21px;border-bottom:1px solid var(--line);min-height:82px;background:#fff;transition:background .18s}.weather-row:last-child{border-bottom:0}.weather-row:hover{background:#fbfcfd}.place{font-size:16px;font-weight:620;letter-spacing:.02em;overflow-wrap:anywhere}.place-note{font-size:11px;color:#9aa4ad;margin-top:5px}.condition{display:flex;align-items:center;gap:12px;min-width:0}.iconbox{width:52px;height:52px;flex:0 0 52px;display:grid;place-items:center}.iconbox svg{width:52px;height:52px;display:block}.condition-name{font-size:14px;font-weight:550;white-space:nowrap}.temperature{text-align:right;font-size:17px;font-weight:570;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}.temperature small{font-size:11px;color:#8d99a3;font-weight:450;margin-left:2px}.row-meta{font-size:11px;color:#9aa4ad;margin-top:6px;text-align:right}.anomaly-row .place{letter-spacing:.01em}.footer{display:flex;justify-content:space-between;gap:18px;margin-top:19px;color:#9aa4ad;font-size:11px;line-height:1.8}.footer strong{font-weight:550;color:#7e8b97}.legend{display:flex;gap:15px;flex-wrap:wrap}.legend span{display:inline-flex;align-items:center;gap:6px}.dot{width:6px;height:6px;border-radius:50%;background:#a8c9d9}.dot.anomaly{background:#c5a0a0}.footer-note{margin-top:10px;color:#a2abb3;font-size:10px;line-height:1.7}
@media(max-width:650px){.page{padding:19px 13px 30px}.topline{padding-bottom:17px}.brandname{font-size:14px}.brandsub{font-size:9px}.topmeta{font-size:10px}.clock{font-size:13px}.hero{padding:28px 0 22px;align-items:flex-start;flex-direction:column;gap:10px}.update{padding:0}.weather-row{grid-template-columns:minmax(72px,.8fr) minmax(118px,1.2fr) minmax(78px,.7fr);gap:6px;padding:13px 10px;min-height:75px}.condition{gap:7px}.iconbox{width:42px;height:42px;flex-basis:42px}.iconbox svg{width:42px;height:42px}.place{font-size:13px}.condition-name{font-size:12px}.temperature{font-size:14px}.row-meta{font-size:9px}.place-note{font-size:9px}.footer{flex-direction:column;gap:8px}}
@media(max-width:370px){.weather-row{grid-template-columns:66px minmax(104px,1fr) 76px;padding:12px 8px;gap:4px}.iconbox{width:37px;height:37px;flex-basis:37px}.iconbox svg{width:37px;height:37px}.condition{gap:4px}.condition-name{font-size:11px}.temperature{font-size:13px}}
</style></head><body><div class="page">
<header class="topline"><div class="brand"><div class="brandmark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 3v18M3 12h18M5.64 5.64l12.72 12.72M18.36 5.64 5.64 18.36"/><circle cx="12" cy="12" r="4" fill="#fff"/></svg></div><div><div class="brandname">城市气象服务</div><div class="brandsub">METEOROLOGICAL SERVICE</div></div></div><div class="topmeta"><div>今日时间 · <span id="todayDate">正在读取</span></div><div class="clock" id="clock">--:--:--</div></div></header>
<section class="hero"><div><div class="eyebrow">DAILY FORECAST</div><h1>天气预报</h1><p>各区域天气情况与温度信息</p></div><div class="update"><span id="forecastDate">预报日期读取中</span> · 每日 19:00 更新</div></section>
<div class="sectionhead"><h2>区域天气</h2><span id="count">共 34 个观测区域</span></div><main class="forecast" id="forecast"></main>
<footer class="footer"><div><strong>观测说明</strong><br>常规天气参考公开天气预报；异常现象为虚构记录。</div><div class="legend"><span><i class="dot"></i>常规天气</span><span><i class="dot anomaly"></i>特殊天气现象</span></div></footer><div class="footer-note">常规天气与温度参考 Open-Meteo 公开预报（CC BY 4.0）；异常天气与乱码城市名为虚构演示。每日北京时间 19:00 自动更新，实际运行时间可能略有延迟。</div>
</div>
<script>
function svgIcon(type){
 const start='<svg viewBox="0 0 64 64" aria-hidden="true">',end='</svg>';
 const sun='<g stroke="#E9B94F" stroke-width="3.2" stroke-linecap="round"><path d="M32 5v7M32 52v7M5 32h7M52 32h7M12.8 12.8l5 5M46.2 46.2l5 5M51.2 12.8l-5 5M17.8 46.2l-5 5"/></g><circle cx="32" cy="32" r="13.5" fill="#F5C85F"/>';
 const cloud='<path d="M17 39c-7 0-11-4.8-11-10.2S10.5 19 17 19c2.5-8 9.4-12 17-9.2 5.1 1.8 8.1 5.7 8.7 10.6C49.6 20 55 24.8 55 30.9S50.1 41 43 41H17Z" fill="#C6D6E0"/>';
 const rain='<g fill="#68A9D4"><path d="M18 44c2.8 4.2 2.8 6.4 0 9-2.8-2.6-2.8-4.8 0-9Z"/><path d="M32 45c2.8 4.2 2.8 6.4 0 9-2.8-2.6-2.8-4.8 0-9Z"/><path d="M46 44c2.8 4.2 2.8 6.4 0 9-2.8-2.6-2.8-4.8 0-9Z"/></g>';
 let s='';
 switch(type){
 case 'sun': s=sun;break;
 case 'partly': s='<g transform="translate(-5 5) scale(.78)">'+sun+'</g>'+cloud;break;
 case 'cloud': s=cloud;break;
 case 'rain': s=cloud+rain;break;
 case 'fireRain': s='<path d="M17 34c-7 0-11-4-11-9s5-9 12-8c3-8 10-10 17-7 5 2 8 6 8 11 7-1 12 4 12 9s-5 8-12 8H17Z" fill="#8799A6"/><g fill="#D95743"><path d="M17 39 C12 45 13 49 17 55 C21 49 22 45 17 39Z"/><path d="M31 39 C26 46 27 51 31 58 C36 51 36 46 31 39Z"/><path d="M46 39 C41 45 42 49 46 55 C50 49 51 45 46 39Z"/></g><g fill="#F29A55"><path d="M17 44l-2 6 2-2 2 3-1-6Z"/><path d="M31 44l-2 7 2-2 2 4-1-7Z"/><path d="M46 44l-2 6 2-2 2 3-1-6Z"/></g>';break;
 case 'solarStorm': s='<path d="M17 14a14 14 0 0 1 18 4 14 14 0 0 1 17 13 14 14 0 0 1-9 17 14 14 0 0 1-19 1A14 14 0 0 1 8 36a14 14 0 0 1 9-22Z" fill="#F3C85D"/><g><circle cx="19" cy="20" r="16" fill="#F7D46C"/><circle cx="39" cy="19" r="16" fill="#EFB84F"/><circle cx="20" cy="41" r="16" fill="#F0BD4F"/><circle cx="42" cy="41" r="16" fill="#F7D36C"/></g><g stroke="#E8B64C" stroke-width="2.5" stroke-linecap="round"><path d="M31 3v5M31 56v5M3 31h5M56 31h5M10 10l4 4M50 50l4 4M53 10l-4 4M14 50l-4 4"/></g>';break;
 case 'headRain': s='<g fill="#9FB4C2" stroke="#8098A8" stroke-width="1"><path d="M9 8c3-4 9-4 12 0l2 6-2 7-4 4-5-3-3-7Z"/><path d="M28 4c4-3 10 0 11 5l-1 7-4 5-5-2-4-7Z"/><path d="M46 10c4-3 9 0 10 4l-1 7-4 4-5-3-3-6Z"/><path d="M17 30c4-3 9 0 10 4l-1 7-4 4-5-3-3-6Z"/><path d="M37 27c4-3 9 0 10 4l-1 7-4 4-5-3-3-6Z"/><path d="M48 45c4-3 8 0 9 4l-1 6-4 3-4-2-2-5Z"/></g>';break;
 case 'deepCold': s='<g stroke="#8BCDE5" stroke-width="4.2" stroke-linecap="round" fill="none">';for(let a=0;a<360;a+=60)s+='<g transform="rotate('+a+' 32 32)"><path d="M32 32V5M32 13L25 7M32 13L39 7M32 21L26 16M32 21L38 16"/></g>';s+='</g><path d="M32 19c-9 0-14 7-13 15 0 7 4 11 8 15v5q0 3 4 3t4-3v-5c5-4 8-9 8-15 1-8-4-15-11-15Z" fill="#C4E7F2" stroke="#6EABC8" stroke-width="1.8"/><path d="M22 34c0-5 3-8 7-6l2 7-5 3Zm20 0c0-5-3-8-7-6l-2 7 5 3Z" fill="#426F88"/><path d="M32 36l-3 5h6Z" fill="#426F88"/><path d="M26 48v4m6-4v5m6-5v4" stroke="#426F88" stroke-width="2" stroke-linecap="round"/>';break;
 case 'hollowCloud': s=cloud+'<circle cx="32" cy="29" r="7.5" fill="#fff" stroke="#9FB5C3" stroke-width="2"/>';break;
 case 'fog': s='<g stroke="#A6B7C2" stroke-width="3" stroke-linecap="round" fill="none"><path d="M10 23h44M6 32h48M13 41h39"/></g>';break;
 case 'snow': s=cloud+'<g stroke="#79B9DF" stroke-width="2.4" stroke-linecap="round" fill="none"><path d="M20 45v12m-5-9 10 6m0-6-10 6M42 45v12m-5-9 10 6m0-6-10 6"/></g>';break;
 case 'storm': s=cloud+'<path d="M35 36 25 49h8l-3 11 12-16h-8l4-8Z" fill="#E9B94F"/>';break;
 case 'inverseRain': s=cloud+'<g stroke="#68A9D4" stroke-width="2.5" stroke-linecap="round" fill="none"><path d="M19 55V43m-4 4 4-4 4 4M32 55V43m-4 4 4-4 4 4M45 55V43m-4 4 4-4 4 4"/></g>';break;
 case 'acidRain': s='<path d="M17 34c-7 0-11-4-11-9s5-9 12-8c3-8 10-10 17-7 5 2 8 6 8 11 7-1 12 4 12 9s-5 8-12 8H17Z" fill="#8799A6"/><g fill="#6CA96B"><path d="M18 42l-4 10h7l-2 6 7-11h-6l2-5Z"/><path d="M36 42l-4 10h7l-2 6 7-11h-6l2-5Z"/></g>';break;
 case 'icefall': s='<g fill="#B9DCEB" stroke="#7BAFC8" stroke-width="1.6"><path d="M13 8h9l3 12-6 6-7-8Z"/><path d="M34 5h10l4 11-8 8-7-7Z"/><path d="M22 31h10l3 12-7 7-8-8Z"/><path d="M43 31h8l4 10-7 7-6-7Z"/><path d="M8 48h8l3 9-6 4-6-6Z"/></g>';break;
 case 'strongLight': s='<circle cx="32" cy="32" r="17" fill="#FFFDF1" stroke="#F1E8B7" stroke-width="1.2"/><g stroke="#D8C98A" stroke-width="2" fill="none" stroke-linecap="round"><path d="M8 19V8h11M45 8h11v11M8 45v11h11M56 45v11H45"/></g>';break;
 }
 return start+s+end;
}
function tick(){const d=new Date();const opts={timeZone:'Asia/Shanghai'};document.getElementById('todayDate').textContent=new Intl.DateTimeFormat('zh-CN',{...opts,year:'numeric',month:'2-digit',day:'2-digit',weekday:'short'}).format(d);document.getElementById('clock').textContent=new Intl.DateTimeFormat('zh-CN',{...opts,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(d)}tick();setInterval(tick,1000);
async function loadForecast(){try{const res=await fetch('./forecast.json?v='+Date.now(),{cache:'no-store'});if(!res.ok)throw new Error('forecast');const data=await res.json();document.getElementById('forecastDate').textContent='预报日期 · '+data.forecastDate;document.getElementById('count').textContent='共 '+data.regions.length+' 个观测区域';const host=document.getElementById('forecast');host.innerHTML='';data.regions.forEach(r=>{const row=document.createElement('div');row.className='weather-row'+(r.anomaly?' anomaly-row':'');const place=document.createElement('div');const nm=document.createElement('div');nm.className='place';nm.textContent=r.displayName||r.name;const note=document.createElement('div');note.className='place-note';note.textContent='区域观测';place.append(nm,note);const condition=document.createElement('div');condition.className='condition';const ib=document.createElement('div');ib.className='iconbox';ib.innerHTML=svgIcon(r.icon);const cn=document.createElement('div');cn.className='condition-name';cn.textContent=r.weather;condition.append(ib,cn);const tempWrap=document.createElement('div');const temp=document.createElement('div');temp.className='temperature';temp.textContent=r.temp;const unit=document.createElement('small');unit.textContent='℃';temp.appendChild(unit);const meta=document.createElement('div');meta.className='row-meta';meta.textContent='最低 / 最高温';tempWrap.append(temp,meta);row.append(place,condition,tempWrap);host.appendChild(row)});}catch(e){document.getElementById('forecast').innerHTML='<div style="padding:24px;color:#788593;font-size:13px">预报数据暂时无法读取，请稍后刷新。</div>';}}
loadForecast();
</script></body></html>
