
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>天气预报 · 城市气象服务</title>
<style>
:root {
  --ink:#202b36;
  --muted:#788593;
  --line:#e8edf1;
  --pale:#f6f9fb;
  --anomaly:#b48b91;
}
* { box-sizing:border-box; }
body {
  margin:0;
  background:#fff;
  color:var(--ink);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",
    "PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.page { max-width:1050px; margin:0 auto; padding:30px 28px 46px; }
.topline {
  display:flex; align-items:center; justify-content:space-between;
  padding-bottom:22px; border-bottom:1px solid var(--line); gap:16px;
}
.brand { display:flex; align-items:center; gap:12px; }
.brandmark {
  width:36px; height:36px; border:1px solid #dce6ec;
  border-radius:11px; display:grid; place-items:center; color:#5b9bc3;
}
.brandmark svg { width:22px; height:22px; }
.brandname { font-size:15px; font-weight:650; letter-spacing:.04em; }
.brandsub { font-size:11px; color:var(--muted); margin-top:4px; letter-spacing:.08em; }
.topmeta {
  font-size:12px; color:var(--muted); text-align:right;
  line-height:1.8; font-variant-numeric:tabular-nums;
}
.clock { font-size:15px; color:#344655; font-weight:600; letter-spacing:.03em; }
.hero {
  padding:34px 0 27px; display:flex; align-items:flex-end;
  justify-content:space-between; gap:20px;
}
.eyebrow { font-size:11px; letter-spacing:.16em; color:#7f8e9b; }
.hero h1 { font-size:clamp(27px,4vw,38px); font-weight:580; letter-spacing:-.04em; margin:10px 0 8px; }
.hero p { font-size:13px; color:var(--muted); margin:0; line-height:1.8; }
.update { font-size:12px; color:#7f8e9b; padding-bottom:5px; }
.sectionhead { display:flex; justify-content:space-between; align-items:center; margin:7px 0 13px; }
.sectionhead h2 { font-size:14px; font-weight:650; margin:0; }
.sectionhead span { font-size:11px; color:#8995a0; letter-spacing:.04em; }
.forecast { border:1px solid var(--line); border-radius:15px; overflow:hidden; }
.weather-row {
  display:grid;
  grid-template-columns:minmax(100px,1.15fr) minmax(150px,1.15fr) minmax(100px,.75fr);
  align-items:center; gap:12px; padding:15px 21px;
  border-bottom:1px solid var(--line); min-height:82px;
  background:#fff; transition:background .18s;
}
.weather-row:last-child { border-bottom:0; }
.weather-row:hover { background:#fbfcfd; }
.place { font-size:16px; font-weight:620; letter-spacing:.02em; overflow-wrap:anywhere; }
.place-note { font-size:11px; color:#9aa4ad; margin-top:5px; }
.condition { display:flex; align-items:center; gap:12px; min-width:0; }
.iconbox { width:52px; height:52px; flex:0 0 52px; display:grid; place-items:center; }
.iconbox svg { width:52px; height:52px; display:block; }
.condition-name { font-size:14px; font-weight:550; overflow-wrap:anywhere; }
.temperature {
  text-align:right; font-size:17px; font-weight:570;
  letter-spacing:-.02em; font-variant-numeric:tabular-nums;
  overflow-wrap:anywhere;
}
.temperature small { font-size:11px; color:#8d99a3; font-weight:450; margin-left:2px; }
.row-meta { font-size:11px; color:#9aa4ad; margin-top:6px; text-align:right; }
.anomaly-row .place { color:#8c626b; }
.anomaly-row { background:#fffdfd; }
.footer {
  display:flex; justify-content:space-between; gap:18px;
  margin-top:19px; color:#9aa4ad; font-size:11px; line-height:1.8;
}
.footer strong { font-weight:550; color:#7e8b97; }
.legend { display:flex; gap:15px; flex-wrap:wrap; }
.legend span { display:inline-flex; align-items:center; gap:6px; }
.dot { width:6px; height:6px; border-radius:50%; background:#a8c9d9; }
.dot.anomaly { background:#c5a0a0; }
.footer-note { margin-top:10px; color:#a2abb3; font-size:10px; line-height:1.7; }
.status { padding:24px 16px; text-align:center; color:var(--muted); font-size:13px; }
.status.error { color:#a35f5f; }
@media(max-width:650px) {
  .page { padding:19px 13px 30px; }
  .topline { padding-bottom:17px; }
  .brandname { font-size:14px; }
  .brandsub { font-size:9px; }
  .topmeta { font-size:10px; }
  .clock { font-size:13px; }
  .hero { padding:28px 0 22px; align-items:flex-start; flex-direction:column; gap:10px; }
  .update { padding:0; }
  .weather-row {
    grid-template-columns:minmax(75px,.8fr) minmax(105px,1.15fr) minmax(80px,.8fr);
    gap:6px; padding:13px 10px; min-height:75px;
  }
  .condition { gap:7px; }
  .iconbox { width:42px; height:42px; flex-basis:42px; }
  .iconbox svg { width:42px; height:42px; }
  .place { font-size:13px; }
  .condition-name { font-size:12px; }
  .temperature { font-size:14px; }
  .row-meta { font-size:9px; }
  .place-note { font-size:9px; }
  .footer { flex-direction:column; gap:8px; }
}
@media(max-width:370px) {
  .weather-row { grid-template-columns:65px minmax(90px,1fr) 76px; padding:12px 7px; gap:4px; }
  .iconbox { width:35px; height:35px; flex-basis:35px; }
  .iconbox svg { width:35px; height:35px; }
  .condition { gap:4px; }
  .condition-name { font-size:11px; }
  .temperature { font-size:12px; }
}
</style>
</head>
<body>
<div class="page">
  <header class="topline">
    <div class="brand">
      <div class="brandmark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.5" stroke-linecap="round">
          <path d="M12 3v18M3 12h18M5.64 5.64l12.72 12.72M18.36 5.64 5.64 18.36"/>
          <circle cx="12" cy="12" r="4" fill="#fff"/>
        </svg>
      </div>
      <div>
        <div class="brandname">城市气象服务</div>
        <div class="brandsub">METEOROLOGICAL SERVICE</div>
      </div>
    </div>
    <div class="topmeta">
      <div>今日时间 · <span id="todayDate">正在读取</span></div>
      <div class="clock" id="clock">--:--:--</div>
    </div>
  </header>

  <section class="hero">
    <div>
      <div class="eyebrow">DAILY FORECAST</div>
      <h1>天气预报</h1>
      <p>各区域天气情况与温度信息</p>
    </div>
    <div class="update" id="updateInfo">区域观测 · 正在连接</div>
  </section>

  <div class="sectionhead">
    <h2>区域天气</h2>
    <span id="count">正在读取区域数据</span>
  </div>

  <main class="forecast" id="forecast">
    <div class="status">正在读取天气数据……</div>
  </main>

  <footer class="footer">
    <div>
      <strong>观测说明</strong><br>
      常规天气来自公开预报，异常天气为虚构现象。
    </div>
    <div class="legend">
      <span><i class="dot"></i>常规天气</span>
      <span><i class="dot anomaly"></i>特殊天气现象</span>
    </div>
  </footer>

  <div class="footer-note">
    常规天气与温度参考 Open-Meteo 公开预报；
    异常现象、异常估算温度及乱码城市名为虚构演示。
    数据每日自动更新，实际运行时间可能略有延迟。
  </div>
</div>

<script>
const forecastHost = document.getElementById("forecast");

function makeSvg(type) {
  const start = '<svg viewBox="0 0 64 64" aria-hidden="true">';
  const end = '</svg>';

  const sun =
    '<g stroke="#E9B94F" stroke-width="3.2" stroke-linecap="round">' +
    '<path d="M32 5v7M32 52v7M5 32h7M52 32h7M12.8 12.8l5 5M46.2 46.2l5 5M51.2 12.8l-5 5M17.8 46.2l-5 5"/>' +
    '</g><circle cx="32" cy="32" r="13.5" fill="#F5C85F"/>';

  const cloud =
    '<path d="M17 39c-7 0-11-4.8-11-10.2S10.5 19 17 19c2.5-8 9.4-12 17-9.2 5.1 1.8 8.1 5.7 8.7 10.6C49.6 20 55 24.8 55 30.9S50.1 41 43 41H17Z" fill="#C6D6E0"/>';

  const rain =
    '<g fill="#68A9D4"><path d="M18 44c2.8 4.2 2.8 6.4 0 9-2.8-2.6-2.8-4.8 0-9Z"/><path d="M32 45c2.8 4.2 2.8 6.4 0 9-2.8-2.6-2.8-4.8 0-9Z"/><path d="M46 44c2.8 4.2 2.8 6.4 0 9-2.8-2.6-2.8-4.8 0-9Z"/></g>';

  let drawing = "";

  switch (type) {
    case "sun":
      drawing = sun;
      break;
    case "partly":
      drawing = '<g transform="translate(-5 5) scale(.78)">' + sun + '</g>' + cloud;
      break;
    case "cloud":
      drawing = cloud;
      break;
    case "rain":
      drawing = cloud + rain;
      break;
    case "fog":
      drawing = cloud +
        '<g stroke="#9AAEBB" stroke-width="3" stroke-linecap="round"><path d="M10 46h44M15 53h34"/></g>';
      break;
    case "snow":
      drawing = cloud +
        '<g stroke="#78B8D8" stroke-width="2.5" stroke-linecap="round"><path d="M18 47v8m-4-4h8m10-4v8m-4-4h8m10-4v8m-4-4h8"/></g>';
      break;
    case "storm":
      drawing = cloud +
        '<path d="M34 35 23 49h9l-3 11 14-18h-9l4-7Z" fill="#E9B94F"/>';
      break;
    case "fireRain":
      drawing = cloud +
        '<g fill="#D95743"><path d="M17 40C10 48 14 53 17 56c4-4 5-9 0-16Z"/><path d="M32 40c-7 8-3 13 0 16 4-4 5-9 0-16Z"/><path d="M47 40c-7 8-3 13 0 16 4-4 5-9 0-16Z"/></g>';
      break;
    case "solarStorm":
      drawing =
        '<circle cx="32" cy="32" r="17" fill="#F5C85F"/>' +
        '<g stroke="#E9A84D" stroke-width="3" stroke-linecap="round"><path d="M32 4v8M32 52v8M4 32h8M52 32h8M12 12l6 6M46 46l6 6M52 12l-6 6M18 46l-6 6"/></g>' +
        '<path d="M23 22q9-8 18 0t0 20q-9 8-18 0t0-20Z" fill="#F19A52"/>';
      break;
    case "headRain":
      drawing =
        '<g fill="#9FB4C2" stroke="#8098A8" stroke-width="1"><path d="M9 8c3-4 9-4 12 0l2 6-2 7-4 4-5-3-3-7Z"/><path d="M28 4c4-3 10 0 11 5l-1 7-4 5-5-2-4-7Z"/><path d="M46 10c4-3 9 0 10 4l-1 7-4 4-5-3-3-6Z"/><path d="M17 30c4-3 9 0 10 4l-1 7-4 4-5-3-3-6Z"/><path d="M37 27c4-3 9 0 10 4l-1 7-4 4-5-3-3-6Z"/></g>';
      break;
    case "deepCold":
      drawing =
        '<g stroke="#8BCDE5" stroke-width="3" stroke-linecap="round"><path d="M32 6v52M9 19l46 26M9 45l46-26M25 13l7 7 7-7M25 51l7-7 7 7M13 27l10-1-1-10M51 37l-10 1 1 10M13 37l10 1-1 10M51 27l-10-1 1-10"/></g>' +
        '<circle cx="32" cy="32" r="8" fill="#C4E7F2" stroke="#6EABC8" stroke-width="2"/>';
      break;
    case "hollowCloud":
      drawing = cloud + '<circle cx="32" cy="29" r="7.5" fill="#fff" stroke="#9FB5C3" stroke-width="2"/>';
      break;
    case "inverseRain":
      drawing = cloud +
        '<g fill="none" stroke="#68A9D4" stroke-width="3" stroke-linecap="round"><path d="M18 53V43m-5 5 5-5 5 5M32 53V43m-5 5 5-5 5 5M46 53V43m-5 5 5-5 5 5"/></g>';
      break;
    case "acidRain":
      drawing = cloud +
        '<g fill="#A5B86A"><path d="M18 44c3 5 3 7 0 9-3-2-3-4 0-9Z"/><path d="M32 44c3 5 3 7 0 9-3-2-3-4 0-9Z"/><path d="M46 44c3 5 3 7 0 9-3-2-3-4 0-9Z"/></g>';
      break;
    case "icefall":
      drawing =
        '<g fill="#C7E8F5" stroke="#78B8D8" stroke-width="1.5"><path d="M12 9 21 25 13 23Z"/><path d="M32 5 42 25 32 22Z"/><path d="M48 17 57 34 48 31Z"/><path d="M23 32 33 49 23 46Z"/><path d="M42 38 51 55 42 52Z"/></g>';
      break;
    case "strongLight":
      drawing = sun +
        '<g stroke="#F0C85E" stroke-width="2" stroke-linecap="round"><path d="M32 1v7M32 56v7M1 32h7M56 32h7M7 7l5 5M52 52l5 5M57 7l-5 5M12 52l-5 5"/></g>';
      break;
    default:
      drawing = cloud;
  }

  return start + drawing + end;
}

function addText(parent, className, value, tag = "div") {
  const element = document.createElement(tag);
  if (className) element.className = className;
  element.textContent = value == null ? "" : String(value);
  parent.appendChild(element);
  return element;
}

function renderForecast(data) {
  if (!data || !Array.isArray(data.regions)) {
    throw new Error("天气数据格式不正确");
  }

  forecastHost.replaceChildren();

  document.getElementById("count").textContent =
    "共 " + data.regions.length + " 个观测区域";

  const updateInfo = document.getElementById("updateInfo");
  updateInfo.textContent = data.generatedAt
    ? "数据更新 · " + data.generatedAt
    : "区域观测 · 数据已读取";

  data.regions.forEach(region => {
    const row = document.createElement("div");
    row.className = "weather-row" + (region.anomaly ? " anomaly-row" : "");

    const placeBox = document.createElement("div");
    addText(placeBox, "place", region.displayName || region.name || "未知区域");

    const placeNote = region.anomaly
      ? "异常区域 · 原名：" + (region.name || "未知")
      : "区域观测";
    addText(placeBox, "place-note", placeNote);
    row.appendChild(placeBox);

    const condition = document.createElement("div");
    condition.className = "condition";

    const iconBox = document.createElement("div");
    iconBox.className = "iconbox";
    iconBox.innerHTML = makeSvg(region.icon);
    condition.appendChild(iconBox);

    addText(condition, "condition-name", region.weather || "未知天气");
    row.appendChild(condition);

    const temperatureBox = document.createElement("div");
    const temperature = addText(
      temperatureBox,
      "temperature",
      region.temp == null ? "--" : region.temp
    );
    const unit = document.createElement("small");
    unit.textContent = "℃";
    temperature.appendChild(unit);

    addText(
      temperatureBox,
      "row-meta",
      region.tempLabel || "最低 / 最高温"
    );
    row.appendChild(temperatureBox);

    forecastHost.appendChild(row);
  });
}

async function loadForecast() {
  forecastHost.replaceChildren();
  addText(forecastHost, "status", "正在读取天气数据……");

  try {
    const response = await fetch("./forecast.json?t=" + Date.now(), {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error("服务器返回状态 " + response.status);
    }

    const data = await response.json();
    renderForecast(data);
  } catch (error) {
    forecastHost.replaceChildren();

    addText(
      forecastHost,
      "status error",
      "天气数据读取失败，请稍后刷新页面。"
    );

    document.getElementById("count").textContent = "暂时无法读取数据";
    document.getElementById("updateInfo").textContent = "数据连接失败";
    console.error("读取 forecast.json 失败：", error);
  }
}

function tickClock() {
  const now = new Date();
  const chinaTime = new Date(
    now.toLocaleString("en-US", { timeZone: "Asia/Shanghai" })
  );

  document.getElementById("todayDate").textContent =
    new Intl.DateTimeFormat("zh-CN", {
      timeZone: "Asia/Shanghai",
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      weekday: "short"
    }).format(now);

  document.getElementById("clock").textContent =
    new Intl.DateTimeFormat("zh-CN", {
      timeZone: "Asia/Shanghai",
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      hour12: false
    }).format(now);
}

tickClock();
setInterval(tickClock, 1000);
loadForecast();
</script>
</body>
</html>
